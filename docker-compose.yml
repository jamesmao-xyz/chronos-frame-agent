version: "3.8"

services:
  chronos-smart-frame:
    build:
      context: .
      dockerfile: Dockerfile
    image: chronos-frame-agent:latest
    container_name: chronos-smart-frame
    restart: unless-stopped
    ports:
      - "8168:8168"
    volumes:
      # Mount the auto-refreshing Application Default Credentials (ADC) file read-only
      - ./secrets/application_default_credentials.json:/secrets/application_default_credentials.json:ro
      # Persist the generated 3-image FIFO gallery across container restarts
      - ./smart_frame_web:/app/smart_frame_web
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - GOOGLE_GENAI_USE_VERTEXAI=true
      - PORT=8168
      - SCHEDULE_INTERVAL_SECONDS=${SCHEDULE_INTERVAL_SECONDS:-900}
      - ROTATION_INTERVAL_SECONDS=${ROTATION_INTERVAL_SECONDS:-300}
      - TZ=${TZ:-Australia/Sydney}

  # 🌙 Automatic Nightly Shutdown (10 PM) & Morning Start (6 AM) - Australian Eastern Time
  nightly-scheduler:
    image: docker:cli
    container_name: chronos-scheduler
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Australia/Sydney}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache tzdata > /dev/null 2>&1
        echo "0 22 * * * docker stop chronos-smart-frame" > /etc/crontabs/root
        echo "0 6 * * * docker start chronos-smart-frame" >> /etc/crontabs/root
        crond -f -l 2
